[project]
name = "app"
version = "0.1.1"
description = "Arnés de agentes e infraestructura de proyecto para trabajo general en Python."
authors = [
  { name = "cacelass" }
]
readme = "README.md"
requires-python = ">= 3.12"
license = { text = "MIT" }
# Sin dependencias de runtime a propósito: el arnés (`agents/`) es stdlib
# puro, así que `uv sync` en un repo recién clonado no descarga nada de
# producción. Añade aquí lo que tu proyecto necesite — `uv add <paquete>`, o
# pídeselo al agente `env`, que es el dueño de esta sección.
dependencies = []

[project.optional-dependencies]
dev = [
    "bandit",
    "hypothesis",
    "mypy",
    "pip-audit",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "radon",
    "ruff",
]

docs = [
    "sphinx",
    "sphinx-rtd-theme",
    "myst-parser",
]

# RAG local (`make index-rag`, agente `rag`). chromadb pesa: por eso es un
# extra y no una dependencia base — el resto del arnés funciona sin él.
rag = [
    "chromadb>=0.5",
]

[project.scripts]
app = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ─────────────────────────────────────────────────────────────────────────────
#  Calidad
# ─────────────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "build", "dist", "agents/external"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # la longitud la vigila el formateador, no el linter
    "B008",   # llamadas en argumentos por defecto: FastAPI y typer las exigen
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests", "agents/tests"]
python_files = ["test_*.py"]
markers = [
    "slow: tests que tardan más de un segundo",
]

[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*"]
